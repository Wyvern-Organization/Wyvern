<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wyvern Auth Callback</title>
</head>
<body>
  <script>
    (function () {
      try {
        if (window.opener) {
          window.opener.postMessage({ type: 'wyv-auth-callback', ok: true, href: window.location.href }, '*');
        }
      } catch {}
      document.body.textContent = 'Authentication complete. You can close this window.';
    })();
  </script>
</body>
</html>
